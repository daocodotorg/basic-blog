# Railway config-as-code for this service.
# Set the service Root Directory to `packages/convex-blog-mcp` (monorepo) so the
# Uses Dockerfile.http (HTTP MCP). Default Dockerfile is stdio-only. See README.md.
#
# https://docs.railway.com/reference/config-as-code

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile.http"
watchPatterns = ["packages/convex-blog-mcp/**"]

[deploy]
healthcheckPath = "/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
