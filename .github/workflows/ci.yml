name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck CMS package
        run: pnpm --filter basic-blog-convex-blog-cms run typecheck

      - name: Typecheck MCP package
        run: pnpm --filter @basic-blog/convex-blog-mcp run typecheck

      - name: Lint CMS package
        run: pnpm --filter basic-blog-convex-blog-cms run lint

      - name: Test package
        run: pnpm test

      - name: Build CMS package
        run: pnpm --filter basic-blog-convex-blog-cms run build
