# Publish basic-blog-convex-blog-cms when you push a version tag (e.g. v0.1.1).
#
# PRIMARY: npm Trusted publishing (OIDC) — no long-lived token, no OTP.
#   https://docs.npmjs.com/trusted-publishers
#   On npmjs: package → Trusted publishing → GitHub Actions
#   - Repository: daocodotorg/basic-blog (must match package.json repository.url)
#   - Workflow filename: release.yml  (exactly; case-sensitive)
#
# FALLBACK: If OIDC is not set up, add GitHub secret NPM_PUBLISH_TOKEN = npm *Automation*
#   or granular *read+write* token for this package. Do NOT use a classic "Publish" token
#   with 2FA — that causes EOTP in CI.
#
# Remove any old Actions secret named NPM_TOKEN if you rely on OIDC; a bad token in
# ~/.npmrc can force OTP-style auth.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      # No registry-url here — avoids writing _authToken into ~/.npmrc before publish.
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: "pnpm"

      - name: Verify OIDC endpoint (trusted publishing)
        run: |
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::OIDC is not available. Ensure permissions.id-token: write is set on this workflow."
            exit 1
          fi
          echo "OIDC token endpoint present (Trusted publishing can be used)."

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/convex-blog-cms/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $TAG but package.json has $PKG"
            exit 1
          fi
          echo "Publishing $PKG as npm tag latest"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck CMS package
        run: pnpm --filter basic-blog-convex-blog-cms run typecheck

      - name: Lint CMS package
        run: pnpm --filter basic-blog-convex-blog-cms run lint

      - name: Test package
        run: pnpm test

      - name: Build CMS package
        run: pnpm --filter basic-blog-convex-blog-cms run build

      # npm 11.5.1+ exchanges GitHub OIDC for a publish token. Clear ~/.npmrc so no stale
      # token from the runner or earlier steps triggers EOTP. Optional NPM_PUBLISH_TOKEN
      # for token-only CI (Automation / granular), not classic "Publish" + 2FA.
      - name: Publish to npm
        working-directory: packages/convex-blog-cms
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_PUBLISH_TOKEN }}
        run: |
          rm -f "${HOME}/.npmrc"
          if [ -n "${NODE_AUTH_TOKEN:-}" ]; then
            printf '%s\n' "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "${HOME}/.npmrc"
            echo "NPM_PUBLISH_TOKEN is set — token auth available (npm still prefers OIDC when Trusted publishing is configured)."
          else
            echo "NPM_PUBLISH_TOKEN unset — publish must succeed via Trusted publishing (OIDC)."
          fi
          npx --yes npm@11.6.0 publish --access public --no-git-checks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
