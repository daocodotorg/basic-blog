# Publish basic-blog-convex-blog-cms to npm and create a GitHub Release when you push a version tag (e.g. v0.1.0).
#
# Prerequisites:
# - Repository secret NPM_TOKEN: MUST be an npm "Automation" (classic) or granular token with package write.
#   Do NOT use a classic "Publish" token if the account has 2FA — publish will fail with EOTP (OTP required).
# - The tag (without leading "v") must exactly match packages/convex-blog-cms/package.json "version".
#
# Typical flow:
# 1. On main: set "version" in packages/convex-blog-cms/package.json, commit, push.
# 2. git tag vX.Y.Z && git push origin vX.Y.Z

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/convex-blog-cms/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $TAG but package.json has $PKG"
            exit 1
          fi
          echo "Publishing $PKG as npm tag latest"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck CMS package
        run: pnpm --filter basic-blog-convex-blog-cms run typecheck

      - name: Lint CMS package
        run: pnpm --filter basic-blog-convex-blog-cms run lint

      - name: Test package
        run: pnpm test

      - name: Build CMS package
        run: pnpm --filter basic-blog-convex-blog-cms run build

      # Use npm publish from the package directory with an explicit ~/.npmrc token line.
      # pnpm publish has been observed to hit EOTP in CI even with NODE_AUTH_TOKEN set.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        working-directory: packages/convex-blog-cms
        run: |
          if [ -z "${NODE_AUTH_TOKEN}" ]; then
            echo "::error::NPM_TOKEN is empty. Add the secret under Settings → Secrets and variables → Actions."
            exit 1
          fi
          printf '%s\n' "//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}" > "${HOME}/.npmrc"
          npm whoami --registry=https://registry.npmjs.org
          npm publish --access public --no-git-checks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
