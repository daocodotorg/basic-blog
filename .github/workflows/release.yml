# Publish basic-blog-convex-blog-cms to npm and create a GitHub Release when you push a version tag (e.g. v0.1.1).
#
# Publishing uses npm "Trusted publishing" (OIDC) when configured on npmjs.com — no NPM_TOKEN, no OTP.
# See packages/convex-blog-cms/PUBLISHING.md and https://docs.npmjs.com/trusted-publishers
#
# Requirements on npm (one-time):
# - Package → Settings → Trusted publishing → GitHub Actions
# - Workflow file name must match exactly: release.yml
# - Repository must match package.json "repository.url" (this repo)
#
# Fallback: set Actions secret NPM_TOKEN to an Automation or granular publish token if you are not using OIDC yet.
#
# The tag (without leading "v") must match packages/convex-blog-cms/package.json "version".

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write # OIDC for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 8

      # Trusted publishing needs Node >= 22.14 and npm >= 11.5.1 (npm docs).
      - uses: actions/setup-node@v4
        with:
          node-version: "22.14"
          cache: "pnpm"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm 11 for registry / OIDC
        run: npm install -g npm@11.5.1

      - name: Verify tag matches package version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./packages/convex-blog-cms/package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::Tag $GITHUB_REF_NAME implies version $TAG but package.json has $PKG"
            exit 1
          fi
          echo "Publishing $PKG as npm tag latest"

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck CMS package
        run: pnpm --filter basic-blog-convex-blog-cms run typecheck

      - name: Lint CMS package
        run: pnpm --filter basic-blog-convex-blog-cms run lint

      - name: Test package
        run: pnpm test

      - name: Build CMS package
        run: pnpm --filter basic-blog-convex-blog-cms run build

      # OIDC is used automatically when Trusted Publisher is configured on npm.
      # If not configured yet, NODE_AUTH_TOKEN (Automation / granular token) is the fallback.
      - name: Publish to npm
        working-directory: packages/convex-blog-cms
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --no-git-checks

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
